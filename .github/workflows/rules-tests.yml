name: Firebase Rules tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install --global firebase-tools@13
      - name: run tests (output captured for debugging)
        run: npm run test:firebase-rules > /tmp/rules-test.log 2>&1 || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"
      - name: post the log as a commit comment on failure
        if: env.TESTS_FAILED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
import json
with open('/tmp/rules-test.log') as f:
    body = f.read()[-60000:]
print(json.dumps({'body': body}))
" > /tmp/comment.json
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/comment.json
          exit 1
